<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }

        .legend {
            background: white;
            padding: 10px;
            font-size: 12px;
            line-height: 18px;
            color: #333;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .legend h6 {
            margin: 0 0 8px 0;
            font-weight: bold;
            font-size: 13px;
        }

        .legend-item {
            margin-bottom: 8px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-color-box {
            width: 16px;
            height: 16px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
            border: 1px solid #333;
        }

        .legend-line {
            width: 20px;
            height: 3px;
            background: red;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }

        .legend-marker {
            width: 18px;
            height: 18px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.instagram.com/_aryaa._a?stkn=OGduM3VqMDBhOHZs"
                            target="_blank"><i class="bi bi-envelope"></i> Contact Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                                class="bi bi-info-circle"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel"><i class="bi bi-info-circle"></i> About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-bordered">
                        <tbody>
                            <tr>
                                <th>Nama</th>
                                <td>Muhammad Arya Alkautsar</td>
                            </tr>
                            <tr>
                                <th>NIM</th>
                                <td>25/559413/SV/26304</td>
                            </tr>
                            <tr>
                                <th>Praktikum</th>
                                <td>PGWEB B</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Feature / Jumlah Penduduk -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="featureModalTitle">Informasi Wilayah</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="featureModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3234395, 123.0159760], 11);

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Toponimi
        var Toponimi = L.geoJSON(null, {

            // Style
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "images/home_marker.png", // icon marker
                        iconSize: [48, 48], // ukuran icon
                        iconAnchor: [24, 48], // posisi icon terhadap titik (point)
                        popupAnchor: [0, -48], // posisi popup terhadap icon
                        tooltipAnchor: [-16, -30], // posisi tooltip terhadap icon
                    }),
                });
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " + feature.geometry.coordinates[0] + "<br>" + "<img src='images/" + feature.properties.image + "' alt='' width='200'>"
                    ;

                layer.on({
                    click: function (e) {
                        Toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        Toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },

        });

        $.getJSON("geojson/Toponimi.geojson", function (data) {
            Toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Point Sarana Prasarana
            map.addLayer(Toponimi); // Menambahkan GeoJSON Point Sarana Prasarana ke dalam peta
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            // Style
            style: function (feature) {
                if (feature.properties.NAMA_UNSUR === "Jalan Propinsi" || feature.properties.NAMA_UNSUR === "Jalan Provinsi") {
                    return {
                        color: "red",
                        weight: 3.5,
                        opacity: 1,
                    };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Kabupaten") {
                    return {
                        color: "red",
                        weight: 1.5,
                        dashArray: "5, 5",
                        opacity: 1,
                    };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Lain") {
                    return {
                        color: "black",
                        weight: 1.5,
                        dashArray: "5, 5",
                        opacity: 1,
                    };
                }
                return {
                    color: "black",
                    weight: 1.5,
                    dashArray: "5, 5",
                    opacity: 1,
                };
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (m): " + feature.properties.Panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },

        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data); // Menambahkan data ke dalam GeoJSON Polyline Jalan
            map.addLayer(jalan); // Menambahkan GeoJSON Polyline Jalan ke dalam peta
            jalan.bringToFront();
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            // Style
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffb2'
                    }
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c'
                    }
                }
                if (feature.properties.Penduduk > 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026'
                    }
                }
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = `
                    <table class="table table-striped table-bordered">
                        <tr>
                            <th>Kecamatan</th>
                            <td>` + feature.properties.WADMKC + `</td>
                        </tr>
                        <tr>
                            <th>Kabupaten/Kota</th>
                            <td>` + feature.properties.WADMKK + `</td>
                        </tr>
                        <tr>
                            <th>Jumlah Penduduk</th>
                            <td>` + feature.properties.Penduduk + ` Jiwa</td>
                        </tr>
                        <tr>
                            <th>Luas</th>
                            <td>` + feature.properties.luas_km2 + ` km&sup2;</td>
                        </tr>
                    </table>
                `;

                layer.on({
                    click: function (e) {
                        $("#featureModalTitle").html("Kecamatan " + feature.properties.WADMKC);
                        $("#featureModalBody").html(popup_content);
                        $("#featureModal").modal("show");
                    },
                    mouseover: function (e) {
                        jumlah_penduduk.bindTooltip(feature.properties.WADMKC, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },

        });

        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON Polygon Jumlah Penduduk
            map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON Polygon Jumlah Penduduk ke dalam peta
            jumlah_penduduk.bringToBack();
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var overlayMaps = {
            "Toponimi": Toponimi,
            "Jalan": jalan,
            "Jumlah Penduduk": jumlah_penduduk,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);

        // Menjaga urutan layer: Toponimi (atas), Jalan (tengah), Jumlah Penduduk (bawah)
        map.on("overlayadd", function () {
            jumlah_penduduk.bringToBack();
            jalan.bringToFront();
        });

        // Menambahkan Legenda di Kiri Atas (topleft)
        var legend = L.control({ position: "topleft" });

        legend.onAdd = function (map) {
            var div = L.DomUtil.create("div", "legend");
            div.innerHTML = `
                <h6>Legenda</h6>
                <div class="legend-item">
                    <strong>Toponimi</strong><br>
                    <img src="images/home_marker.png" class="legend-marker" alt="Toponimi"> Titik Toponimi
                </div>
                <div class="legend-item">
                    <strong>Jalan</strong><br>
                    <div><svg width="24" height="10" style="vertical-align: middle; margin-right: 4px;"><line x1="0" y1="5" x2="24" y2="5" stroke="red" stroke-width="3" /></svg> Jalan Propinsi</div>
                    <div><svg width="24" height="10" style="vertical-align: middle; margin-right: 4px;"><line x1="0" y1="5" x2="24" y2="5" stroke="red" stroke-width="1.5" stroke-dasharray="4,4" /></svg> Jalan Kabupaten</div>
                    <div><svg width="24" height="10" style="vertical-align: middle; margin-right: 4px;"><line x1="0" y1="5" x2="24" y2="5" stroke="black" stroke-width="1.5" stroke-dasharray="4,4" /></svg> Jalan Lain</div>
                </div>
                <div class="legend-item">
                    <strong>Jumlah Penduduk</strong><br>
                    <div><span class="legend-color-box" style="background: #ffffb2;"></span> &le; 12.000 jiwa</div>
                    <div><span class="legend-color-box" style="background: #fd8d3c;"></span> 12.001 - 24.000 jiwa</div>
                    <div><span class="legend-color-box" style="background: #bd0026;"></span> &gt; 24.000 jiwa</div>
                </div>
            `;
            return div;
        };

        legend.addTo(map);

        // Menambahkan Skala di Kiri Bawah
        L.control.scale({ position: "bottomleft" }).addTo(map);

    </script>
</body>

</html>
